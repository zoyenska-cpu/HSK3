<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 3 Study</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#f6f7fb;color:#1c1e26;padding-bottom:80px}
h1{font-size:22px;padding:16px;margin:0}
.card{background:#fff;margin:10px 16px;padding:16px;border-radius:14px}
.bar{height:8px;background:#e3e5ee;border-radius:4px;overflow:hidden}
.fill{height:100%;background:#d9381e}
.hz{font-size:34px}
.big{font-size:44px;text-align:center;margin:20px 0}
.py{color:#d9381e;font-size:18px}
.meta{color:#6b7080;font-size:14px}
button{font-size:16px;padding:12px 16px;border:0;border-radius:12px;background:#d9381e;color:#fff;min-height:44px;margin:2px}
button.alt{background:#6b7080}
.row{display:flex;gap:6px}
.row button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}
nav div{flex:1;text-align:center;padding:14px 0;font-size:13px;color:#6b7080}
nav div.on{color:#d9381e;font-weight:bold}
</style>
</head>
<body>
<h1 id="t">HSK 3 Units</h1>
<div id="app">Loading...</div>
<nav>
<div id="n-learn" onclick="showHome()">Learn</div>
<div id="n-review" onclick="showReview()">Review</div>
<div id="n-listen" onclick="soon('Listen')">Listen</div>
<div id="n-practice" onclick="soon('Practice')">Practice</div>
<div id="n-stats" onclick="soon('Stats')">Stats</div>
</nav>
<script>
var UNITS=[
{id:1,words:[
{hz:"帮助",py:"bāngzhù",en:"to help",pos:"verb",ex:"谢谢你帮助我。",exPy:"Xièxie nǐ bāngzhù wǒ.",exEn:"Thank you for helping me."},
{hz:"比较",py:"bǐjiào",en:"fairly; to compare",pos:"adverb",ex:"今天比较冷。",exPy:"Jīntiān bǐjiào lěng.",exEn:"Today is fairly cold."},
{hz:"水果",py:"shuǐguǒ",en:"fruit",pos:"noun",ex:"我喜欢吃水果。",exPy:"Wǒ xǐhuan chī shuǐguǒ.",exEn:"I like eating fruit."}
]},
{id:2,words:[]},{id:3,words:[]},{id:4,words:[]},{id:5,words:[]},
{id:6,words:[]},{id:7,words:[]},{id:8,words:[]},{id:9,words:[]},
{id:10,words:[]},{id:11,words:[]},{id:12,words:[]},{id:13,words:[]},
{id:14,words:[]},{id:15,words:[]}
];
var progress={},cards={},settings={front:"hz"},queue=[],current=null,flipped=false;
try{progress=JSON.parse(localStorage.getItem("hsk3")||"{}")}catch(e){}
try{cards=JSON.parse(localStorage.getItem("hsk3cards")||"{}")}catch(e){}
try{settings=JSON.parse(localStorage.getItem("hsk3set")||'{"front":"hz"}')}catch(e){}
function saveAll(){try{localStorage.setItem("hsk3",JSON.stringify(progress));localStorage.setItem("hsk3cards",JSON.stringify(cards));localStorage.setItem("hsk3set",JSON.stringify(settings))}catch(e){}}
function today(){return Math.floor(Date.now()/86400000)}
function findWord(hz){for(var i=0;i<UNITS.length;i++){for(var j=0;j<UNITS[i].words.length;j++){if(UNITS[i].words[j].hz===hz)return UNITS[i].words[j]}}return null}
function setNav(id){var ids=["learn","review","listen","practice","stats"];for(var i=0;i<ids.length;i++){document.getElementById("n-"+ids[i]).className=(ids[i]===id)?"on":""}}
function soon(name){setNav(name.toLowerCase());document.getElementById("t").textContent=name;document.getElementById("app").innerHTML='<div class="card">'+name+' is coming in a later stage.</div>'}
function showHome(){
setNav("learn");document.getElementById("t").textContent="HSK 3 Units";
var html="";
for(var i=0;i<UNITS.length;i++){var u=UNITS[i],done=0;
for(var j=0;j<u.words.length;j++){if(progress[u.words[j].hz])done++}
var pct=u.words.length?Math.round(100*done/u.words.length):0;
html+='<div class="card" onclick="showUnit('+u.id+')"><b>Unit '+u.id+'</b> <span class="meta">('+done+'/'+u.words.length+')</span><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'}
document.getElementById("app").innerHTML=html}
function showUnit(id){
setNav("learn");var u=UNITS[id-1];document.getElementById("t").textContent="Unit "+id;
var html='<div class="card"><button onclick="showHome()">Back</button><p class="meta">Unit placement not yet confirmed against your book.</p></div>';
for(var j=0;j<u.words.length;j++){var w=u.words[j];
html+='<div class="card"><div class="hz">'+w.hz+'</div><div class="py">'+w.py+'</div><div>'+w.en+' <span class="meta">('+w.pos+')</span></div><p>'+w.ex+'<br><span class="meta">'+w.exPy+'<br>'+w.exEn+'</span></p><button onclick="toggle('+j+','+id+')">'+(progress[w.hz]?"Learned (tap to undo)":"Mark as learned")+'</button></div>'}
document.getElementById("app").innerHTML=html}
function toggle(j,id){var hz=UNITS[id-1].words[j].hz;progress[hz]=!progress[hz];if(progress[hz]&&!cards[hz]){cards[hz]={due:today(),interval:0,ease:2.5}}saveAll();showUnit(id)}
function dueList(){var list=[],t=today();for(var hz in cards){if(cards.hasOwnProperty(hz)&&cards[hz].due<=t&&findWord(hz)){list.push(hz)}}return list}
function showReview(){
setNav("review");document.getElementById("t").textContent="Review";
var due=dueList(),total=0;for(var k in cards){if(cards.hasOwnProperty(k))total++}
var html='<div class="card"><div class="big">'+due.length+'</div><div class="meta" style="text-align:center">cards due today ('+total+' in your deck)</div></div>';
html+='<div class="card"><div class="meta">Show on the front:</div><div class="row"><button class="'+(settings.front==="hz"?"":"alt")+'" onclick="setFront(\'hz\')">Character</button><button class="'+(settings.front==="py"?"":"alt")+'" onclick="setFront(\'py\')">Pinyin</button><button class="'+(settings.front==="en"?"":"alt")+'" onclick="setFront(\'en\')">English</button></div></div>';
if(due.length>0){html+='<div class="card"><button onclick="startReview()">Start review</button></div>'}
else if(total===0){html+='<div class="card">Your deck is empty. In Learn, open a unit and tap Mark as learned on some words.</div>'}
else{html+='<div class="card">All done for today. Come back tomorrow.</div>'}
document.getElementById("app").innerHTML=html}
function setFront(f){settings.front=f;saveAll();showReview()}
function startReview(){queue=dueList();nextCard()}
function nextCard(){if(queue.length===0){showReview();return}current=queue[0];flipped=false;drawCard()}
function drawCard(){
var w=findWord(current),f=settings.front;
var ft=(f==="hz")?w.hz:(f==="py")?w.py:w.en;
var html='<div class="card meta">'+queue.length+' left in this session</div>';
html+='<div class="card" onclick="flip()"><div class="big">'+ft+'</div>';
if(!flipped){html+='<div class="meta" style="text-align:center">Tap the card to see the answer</div></div>'}
else{html+='<div style="text-align:center"><div class="hz">'+w.hz+'</div><div class="py">'+w.py+'</div><div>'+w.en+'</div><p class="meta">'+w.ex+'<br>'+w.exPy+'<br>'+w.exEn+'</p></div></div>';
html+='<div class="card"><div class="row"><button class="alt" onclick="rate(0)">Again</button><button class="alt" onclick="rate(1)">Hard</button><button onclick="rate(2)">Good</button><button onclick="rate(3)">Easy</button></div></div>'}
document.getElementById("app").innerHTML=html}
function flip(){if(!flipped){flipped=true;drawCard()}}
function rate(r){
var c=cards[current];
if(r===0){c.interval=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=today();queue.push(queue.shift())}
else{
if(r===1){c.interval=Math.max(1,Math.round((c.interval||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15)}
if(r===2){c.interval=c.interval?Math.round(c.interval*c.ease):1}
if(r===3){c.interval=c.interval?Math.round(c.interval*c.ease*1.4):3;c.ease=c.ease+0.15}
c.due=today()+c.interval;queue.shift()}
saveAll();nextCard()}
showHome();
</script>
</body>
</html>
